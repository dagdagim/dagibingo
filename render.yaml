services:
  # ==============================================================================
  # 1. DAGI BINGO - Real-Time Authoritative Server Engine on Render
  # ==============================================================================
  - type: web
    name: dagi-bingo-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GAME_MODE
        value: DEMO
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas Connection String in Render Dashboard
      - key: REDIS_URL
        sync: false # Optional: Upstash/Render Redis URL (uses in-memory fallback if empty)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://dagibingo-web.onrender.com
      - key: CHAPA_PUBLIC_KEY
        value: CHAPUBK_TEST-F8wVF0CiDxcc6xAut5vm1oFKM4VCVCG9
      - key: CHAPA_SECRET_KEY
        value: CHASECK_TEST-EzF8SkHTiEva3p8xXcwKREFNpIHCq5hu
      - key: CHAPA_API_URL
        value: https://api.chapa.co/v1

  # ==============================================================================
  # 2. DAGI BINGO - Frontend Single Page Application on Render
  # ==============================================================================
  - type: static
    name: dagibingo-web
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://dagibingolive.onrender.com
      - key: VITE_SOCKET_URL
        value: https://dagibingolive.onrender.com
      - key: VITE_GAME_TITLE
        value: DAGI BINGO
